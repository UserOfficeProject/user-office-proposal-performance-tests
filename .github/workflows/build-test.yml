name: Build testing.

on:
  pull_request:
    branches: [develop]

env:
  NODE_VERSION: 20.x

jobs:
  install-and-cache:
    name: Run install and cache
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        id: cached-node-modules-test
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-test-${{ hashFiles('package-lock.json') }}-${{ env.NODE_VERSION }}

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Cache test-setup node_modules
        id: cached-node-modules-test-setup
        uses: actions/cache@v4
        with:
          path: test-setup/node_modules
          key: node-modules-test-setup-${{ hashFiles('test-setup/package-lock.json') }}-${{ env.NODE_VERSION }}

      - name: Install test-setup dependencies
        if: steps.cached-node-modules-test-setup.outputs.cache-hit != 'true'
        run: npm run install:test-setup

  build:
    runs-on: ubuntu-latest
    needs: install-and-cache

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: cached-node-modules-root
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-root-${{ hashFiles('package-lock.json') }}-${{ env.NODE_VERSION }}

      - name: Restore test-setup node_modules
        id: cached-node-modules-test-setup
        uses: actions/cache@v4
        with:
          path: test-setup/node_modules
          key: node-modules-test-setup-${{ hashFiles('test-setup/package-lock.json') }}-${{ env.NODE_VERSION }}

      - run: npm ci

      - run: npm run build
    