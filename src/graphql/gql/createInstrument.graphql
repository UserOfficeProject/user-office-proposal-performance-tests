mutation CreateInstrument(
  $name: String!
  $shortCode: String!
  $description: String!
  $managerUserId: Int!
) {
  createInstrument(
    name: $name
    shortCode: $shortCode
    description: $description
    managerUserId: $managerUserId
  ) {
    id
    description
    managerUserId
    name
    shortCode
  }
}
