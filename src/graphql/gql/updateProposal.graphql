mutation UpdateProposal(
  $proposalPk: Int!
  $users: [Int!]
  $title: String
  $abstract: String
  $proposerId: Int
  $created: DateTime
) {
  updateProposal(
    proposalPk: $proposalPk
    users: $users
    title: $title
    abstract: $abstract
    proposerId: $proposerId
    created: $created
  ) {
    callId
    statusId
    primaryKey
    proposalId
    proposer {
      id
    }
    users {
      id
    }
  }
}
