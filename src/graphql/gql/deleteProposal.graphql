mutation DeleteProposal($proposalPk: Int!) {
  deleteProposal(proposalPk: $proposalPk) {
    primaryKey
    proposalId
    callId
    status {
      id
      name
      shortCode
    }
    questionary {
      steps {
        topic {
          id
          templateId
        }
      }
      questionaryId
      templateId
    }
  }
}
